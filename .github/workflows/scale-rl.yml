name: Frozen 40x40 nine-fit RL comparison
on:
  push:
    branches: [sr]
    paths: ['.github/workflows/scale-rl.yml']
  workflow_dispatch:
permissions:
  actions: read
  contents: read
concurrency:
  group: frozen-scale-rl
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -e '.[dev]'
      - run: python -m ruff check src tests scripts
      - run: python -m pytest -q
      - run: python -m wild_drone demo --grid 8 --horizon 12 --out runs/ci-demo
      - name: Verify frozen source and one-time study launch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          test "$GITHUB_REF" = refs/heads/sr
          test "$GITHUB_RUN_ATTEMPT" = 1
          git fetch origin sr
          test "$(git rev-parse origin/sr)" = "$GITHUB_SHA"
          test ! -e docs/experiments/rl-main-2026-10-11
          matches=$(gh api --paginate "repos/$GITHUB_REPOSITORY/actions/artifacts" \
            --jq '.artifacts[] | select(.name | startswith("frozen-40x40-rl-")) | .id')
          test -z "$matches"
  fit:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      max-parallel: 9
      matrix:
        algorithm: [dqn, reinforce, a2c]
        seed: [0, 1, 2]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -e '.[dev]'
      - name: Train exactly one frozen fit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          test "$GITHUB_REF" = refs/heads/sr
          test "$GITHUB_RUN_ATTEMPT" = 1
          git fetch origin sr
          test "$(git rev-parse origin/sr)" = "$GITHUB_SHA"
          matches=$(gh api --paginate "repos/$GITHUB_REPOSITORY/actions/artifacts" \
            --jq '.artifacts[] | select(.name | test("^frozen-40x40-rl-.*-${{ matrix.algorithm }}-${{ matrix.seed }}$")) | .id')
          test -z "$matches"
          mkdir -p runs/rl-main-2026-10-11
          python scripts/run_scale_rl.py fit --algorithm '${{ matrix.algorithm }}' \
            --seed '${{ matrix.seed }}' --source-revision "$GITHUB_SHA" \
            --out runs/rl-main-2026-10-11 \
            | tee runs/rl-main-2026-10-11/fit-${{ matrix.algorithm }}-${{ matrix.seed }}.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frozen-40x40-rl-${{ github.sha }}-${{ matrix.algorithm }}-${{ matrix.seed }}
          path: runs/rl-main-2026-10-11
          retention-days: 90
  evaluate:
    needs: fit
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -e '.[dev]'
      - uses: actions/download-artifact@v4
        with:
          pattern: frozen-40x40-rl-${{ github.sha }}-*
          path: runs/rl-main-2026-10-11
          merge-multiple: true
      - name: Evaluate all final models on fresh scenarios
        run: |
          python scripts/run_scale_rl.py evaluate --source-revision "$GITHUB_SHA" \
            --out runs/rl-main-2026-10-11 | tee runs/scale-rl-evaluation.log
      - name: Independently replay and assemble evidence
        run: |
          python scripts/audit_scale_rl.py --run runs/rl-main-2026-10-11 \
            --out docs/experiments/rl-main-2026-10-11 | tee runs/scale-rl-audit.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frozen-40x40-rl-results-${{ github.sha }}
          path: |
            runs/rl-main-2026-10-11
            runs/scale-rl-evaluation.log
            runs/scale-rl-audit.log
            docs/experiments/rl-main-2026-10-11
          retention-days: 90
      - name: Publish only audited results
        run: |
          git fetch origin sr
          test "$(git rev-parse origin/sr)" = "$GITHUB_SHA"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/experiments/rl-main-2026-10-11
          git -c core.whitespace=cr-at-eol diff --cached --check
          git commit -m "Archive the audited nine-fit 40x40 RL comparison"
          git push origin HEAD:sr
