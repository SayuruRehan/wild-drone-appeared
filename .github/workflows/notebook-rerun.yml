name: Clean notebook rerun

on:
  push:
    branches: [sr]
    paths:
      - '.github/workflows/notebook-rerun.yml'
      - 'Wildfire_Drone_Fleet_clean.ipynb'
      - 'docs/experiments/rl-followups-2026-10-11/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  notebook:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned submission dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install -e .
      - name: Run entire submission notebook in a clean kernel
        run: |
          mkdir -p "$RUNNER_TEMP/notebook-rerun"
          python -m jupyter nbconvert --to notebook --execute Wildfire_Drone_Fleet_clean.ipynb \
            --output rerun.ipynb --output-dir "$RUNNER_TEMP/notebook-rerun" \
            --ExecutePreprocessor.timeout=1800 \
            --ExecutePreprocessor.allow_errors=False
          python - "$RUNNER_TEMP/notebook-rerun/rerun.ipynb" <<'PY'
          import json
          import sys
          from pathlib import Path

          notebook = json.loads(Path(sys.argv[1]).read_text())
          code = [cell for cell in notebook['cells'] if cell['cell_type'] == 'code']
          errors = [(i, out.get('ename'), out.get('evalue'))
                    for i, cell in enumerate(code)
                    for out in cell.get('outputs', []) if out.get('output_type') == 'error']
          unexecuted = [i for i, cell in enumerate(code) if cell['execution_count'] is None]
          print(f"NOTEBOOK-RERUN: cells={len(notebook['cells'])}, code={len(code)}, "
                f"executed={len(code)-len(unexecuted)}, "
                f"errors={len(errors)}")
          if errors or unexecuted or len(code) != 42:
              raise RuntimeError(f"Notebook execution incomplete: errors={errors}, "
                                 f"unexecuted={unexecuted}")
          PY
      - name: Archive independently rerun notebook
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: notebook-clean-rerun
          path: ${{ runner.temp }}/notebook-rerun/rerun.ipynb
          if-no-files-found: warn
          retention-days: 30
