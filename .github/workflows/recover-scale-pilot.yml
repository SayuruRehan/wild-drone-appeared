name: Recover 40x40 evidence
on:
  push:
    branches: [sr]
    paths: ['.github/workflows/recover-scale-pilot.yml']
  workflow_dispatch:
permissions:
  actions: read
  contents: write
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -e '.[dev]'
      - uses: actions/download-artifact@v4
        with:
          name: frozen-40x40-pilot-7c9562aa6064f46d96cc9a163de3deb2ecaa3e19
          run-id: 38111928600
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: .
      - name: Reaudit original saved run
        run: |
          test -f runs/scale-pilot-2026-10-11/completion.json
          python - <<'PY'
          import json
          from pathlib import Path
          result = json.loads(Path('runs/scale-pilot-2026-10-11/completion.json').read_text())
          assert result['mission_episodes'] == 140
          assert result['mission_steps'] == 42000
          assert result['ranking_passed'] is True
          assert result['mission_passed'] is False
          PY
          python scripts/audit_scale_pilot.py --run runs/scale-pilot-2026-10-11 --out docs/experiments/scale-pilot-2026-10-11
      - name: Commit verified archive
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/experiments/scale-pilot-2026-10-11
          git -c core.whitespace=cr-at-eol diff --cached --check
          git commit -m "Archive audited 40x40 pilot negative mission result [skip ci]"
          git push origin HEAD:sr
